<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public-layout}">
<head>
    <title>403 - Không có quyền truy cập</title>
</head>
<body>
<div layout:fragment="content" class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-modern p-5 border-danger border-top border-4">
                <h1 class="display-1 text-danger fw-bold">403</h1>
                <h3 class="fw-bold mb-3">Truy cập bị từ chối</h3>
                <p class="text-muted mb-4">
                    Tài khoản của bạn không có quyền truy cập vào tài nguyên này.
                    Vui lòng đăng nhập với tài khoản có quyền hạn phù hợp.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-primary px-4">Về trang chủ</a>
                    <a th:href="@{/login}" class="btn btn-outline-secondary px-4">Đổi tài khoản</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

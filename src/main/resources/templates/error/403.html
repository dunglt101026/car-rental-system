<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Không có quyền truy cập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-modern p-5 border-danger border-top border-4">
                <h1 class="display-1 text-danger fw-bold">403</h1>
                <h3 class="fw-bold mb-3">Truy cập bị từ chối!</h3>
                <p class="text-muted mb-4">
                    Tài khoản của bạn không có đủ thẩm quyền để truy cập vào tài nguyên này.
                    Vui lòng kiểm tra lại quyền hạn hoặc đăng nhập với tài khoản phù hợp.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-primary btn-rounded px-4">Về Trang Chủ</a>
                    <a th:href="@{/login}" class="btn btn-outline-secondary btn-rounded px-4">Đổi Tài Khoản</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public-layout}">
<head>
    <title>400 - Yêu cầu không hợp lệ</title>
</head>
<body>
<div layout:fragment="content" class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-modern p-5 border-warning border-top border-4">
                <h1 class="display-1 text-warning fw-bold">400</h1>
                <h3 class="fw-bold mb-3">Yêu cầu không thể thực hiện</h3>
                <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Yêu cầu của bạn không hợp lệ hoặc vi phạm quy tắc xử lý của hệ thống.'}">
                    Yêu cầu của bạn không hợp lệ hoặc vi phạm quy tắc xử lý của hệ thống.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Quay lại</a>
                    <a th:href="@{/}" class="btn btn-primary px-4">Về trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

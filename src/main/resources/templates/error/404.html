<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/public-layout}">

<head>
    <title>404 - Không tìm thấy trang</title>
</head>

<body>
    <div layout:fragment="content" class="container my-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-modern p-5 border-warning border-top border-4">
                    <h1 class="display-1 text-warning fw-bold">404</h1>
                    <h3 class="fw-bold mb-3">Không tìm thấy tài nguyên</h3>
                    <p class="text-muted mb-4"
                        th:text="${errorMessage != null ? errorMessage : 'Trang hoặc dữ liệu bạn yêu cầu không tồn tại hoặc đã bị di chuyển.'}">
                        Trang hoặc dữ liệu bạn yêu cầu không tồn tại hoặc đã bị di chuyển.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/}" class="btn btn-primary px-4">Về trang chủ</a>
                        <a th:href="@{/cars}" class="btn btn-outline-secondary px-4">Xem danh mục xe</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

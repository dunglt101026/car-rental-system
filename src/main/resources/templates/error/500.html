<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public-layout}">
<head>
    <title>500 - Lỗi hệ thống</title>
</head>
<body>
<div layout:fragment="content" class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-modern p-5 border-danger border-top border-4">
                <h1 class="display-1 text-danger fw-bold">500</h1>
                <h3 class="fw-bold mb-3">Lỗi xử lý hệ thống</h3>
                <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Đã có sự cố bất ngờ xảy ra phía máy chủ. Vui lòng thử lại sau.'}">
                    Đã có sự cố bất ngờ xảy ra phía máy chủ. Vui lòng thử lại sau.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-primary px-4">Về trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

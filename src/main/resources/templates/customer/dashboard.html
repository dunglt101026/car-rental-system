<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public-layout}">
<head>
    <title>Trang cá nhân khách hàng</title>
</head>
<body>
<div layout:fragment="content" class="container my-5">
    <div class="card card-modern p-4 mb-4 border-start border-info border-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold text-dark mb-1">Trang Cá Nhân Khách Hàng</h2>
                <p class="text-muted mb-0">Xin chào: <strong class="text-primary" th:text="${(currentUser != null) ? currentUser.accountName : ((session.CURRENT_USER != null) ? session.CURRENT_USER.accountName : 'Khách hàng')}">customer</strong></p>
            </div>
            <span class="badge bg-info text-dark px-3 py-2 fs-6">Customer</span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card card-modern p-4">
                <h5 class="fw-bold">Lịch sử thuê xe</h5>
                <p class="text-muted small">Danh sách các chuyến xe bạn đã đặt hoặc đang thuê.</p>
                <a th:href="@{/customer/rentals}" class="btn btn-outline-primary btn-sm">Xem chi tiết đơn thuê</a>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card card-modern p-4">
                <h5 class="fw-bold">Thông tin cá nhân & Giấy tờ</h5>
                <p class="text-muted small">Quản lý hồ sơ và xác thực danh tính thuê xe.</p>
                <a th:href="@{/customer/profile}" class="btn btn-outline-primary btn-sm">Xem và chỉnh sửa hồ sơ</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>

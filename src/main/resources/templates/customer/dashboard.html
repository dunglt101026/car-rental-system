<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân khách hàng - Car Rental System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="card card-modern p-4 mb-4 border-start border-info border-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold text-dark mb-1">👤 Trang Cá Nhân Khách Hàng</h2>
                <p class="text-muted mb-0">Xin chào bạn: <strong class="text-primary" th:text="${customerName}">customer</strong></p>
            </div>
            <span class="badge bg-info text-dark px-3 py-2 fs-6">ROLE_CUSTOMER</span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card card-modern p-4">
                <h5 class="fw-bold">🚗 Lịch sử thuê xe</h5>
                <p class="text-muted small">Danh sách các chuyến xe bạn đã đặt hoặc đang thuê.</p>
                <div class="alert alert-light border small">Chưa có lịch sử thuê xe nào.</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card card-modern p-4">
                <h5 class="fw-bold">📄 Thông tin giấy phép lái xe</h5>
                <p class="text-muted small">Quản lý hồ sơ và xác thực danh tính thuê xe.</p>
                <div class="alert alert-light border small">Chưa có thông tin GPLX được cập nhật.</div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public-layout}">
<head>
    <title>Hồ sơ cá nhân</title>
</head>
<body>
<div layout:fragment="content" class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-modern p-4 mb-4 border-start border-info border-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="fw-bold text-dark mb-1">Hồ Sơ Cá Nhân</h2>
                        <p class="text-muted mb-0">Quản lý và cập nhật thông tin cá nhân của bạn.</p>
                    </div>
                    <span class="badge bg-info text-dark px-3 py-2 fs-6">Khách hàng</span>
                </div>
            </div>

            <div class="card card-modern p-4 p-md-5">
                <form th:action="@{/customer/profile}" th:object="${profileRequest}" method="post">
                    <!-- Thông tin tài khoản -->
                    <h5 class="fw-bold text-secondary mb-3 pb-2 border-bottom">Thông tin tài khoản</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Tên tài khoản</label>
                            <input type="text" class="form-control bg-light" th:value="${customer.accountName}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted">Địa chỉ Email</label>
                            <input type="text" class="form-control bg-light" th:value="${customer.email}" disabled>
                        </div>
                    </div>

                    <!-- Thông tin cá nhân và giấy tờ -->
                    <h5 class="fw-bold text-secondary mb-3 pb-2 border-bottom">Thông tin cá nhân và giấy tờ</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="fullName" class="form-label small fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="mobile" class="form-label small fw-semibold">Số điện thoại liên hệ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="mobile" th:field="*{mobile}"
                                   th:classappend="${#fields.hasErrors('mobile')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="birthday" class="form-label small fw-semibold">Ngày sinh <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="birthday" th:field="*{birthday}"
                                   th:classappend="${#fields.hasErrors('birthday')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="identityCard" class="form-label small fw-semibold">Số CCCD / CMND <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="identityCard" th:field="*{identityCard}"
                                   th:classappend="${#fields.hasErrors('identityCard')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('identityCard')}" th:errors="*{identityCard}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="licenceNumber" class="form-label small fw-semibold">Số Giấy phép lái xe (GPLX) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="licenceNumber" th:field="*{licenceNumber}"
                                   th:classappend="${#fields.hasErrors('licenceNumber')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('licenceNumber')}" th:errors="*{licenceNumber}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="licenceDate" class="form-label small fw-semibold">Ngày cấp GPLX <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="licenceDate" th:field="*{licenceDate}"
                                   th:classappend="${#fields.hasErrors('licenceDate')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('licenceDate')}" th:errors="*{licenceDate}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a th:href="@{/customer/rentals}" class="btn btn-outline-secondary px-4">
                            Hủy bỏ
                        </a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

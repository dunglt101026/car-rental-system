<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public-layout}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
<div layout:fragment="content" class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card card-modern p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary">Đăng Nhập</h3>
                    <p class="text-muted small mb-0">Hệ thống cho thuê xe trực tuyến</p>
                </div>

                <!-- Form Login -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">Tên đăng nhập hoặc Email</label>
                        <input type="text" class="form-control" id="username" name="username" th:value="${username}"
                               placeholder="admin@carrent.com hoặc admin" required th:autofocus="${username == null}">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Mật khẩu của bạn" required th:autofocus="${username != null}">
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary fw-semibold py-2">
                            Đăng nhập
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 small">
                    Chưa có tài khoản? <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Đăng ký ngay</a>
                </div>

                <div class="border-top mt-4 pt-3 text-muted" style="font-size: 0.8rem;">
                    <div><strong>Gợi ý tài khoản trong cơ sở dữ liệu:</strong></div>
                    <div>Quản trị: <code>admin</code> / <code>admin123</code></div>
                    <div>Khách hàng: <code>customer1</code> / <code>123456</code></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

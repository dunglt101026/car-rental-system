<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Chỉnh sửa thông tin khách hàng</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Header Section -->
    <div class="card card-modern p-4 mb-4 border-start border-primary border-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold text-dark mb-1">Hồ Sơ Khách Hàng</h2>
                <p class="text-muted mb-0">
                    Xem thông tin tài khoản và điều chỉnh hồ sơ cá nhân của khách hàng:
                    <strong class="text-primary" th:text="${customer.fullName}">Nguyễn Văn A</strong>
                    (Mã: <span th:text="'#' + ${customerId}">#1</span>)
                </p>
            </div>
            <div>
                <a th:href="@{/admin/customers}" class="btn btn-outline-secondary px-3">
                    Quay lại danh sách
                </a>
            </div>
        </div>
    </div>

    <!-- Form Card -->
    <div class="card card-modern p-4 p-md-5">
        <form th:action="@{/admin/customers/edit/{id}(id=${customerId})}"
              th:object="${profileRequest}"
              method="post">

            <!-- Section 1: Thông tin tài khoản liên kết (Chỉ xem) -->
            <h5 class="fw-bold text-secondary mb-3 pb-2 border-bottom">Thông tin tài khoản đăng nhập (Chỉ xem)</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted">Mã khách hàng</label>
                    <input type="text" class="form-control bg-light" th:value="'#' + ${customerId}" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted">Tên tài khoản</label>
                    <input type="text" class="form-control bg-light" th:value="${customer.accountName}" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted">Địa chỉ Email</label>
                    <input type="text" class="form-control bg-light" th:value="${customer.email}" disabled>
                </div>
            </div>

            <!-- Section 2: Thông tin cá nhân & Giấy tờ (Có thể sửa) -->
            <h5 class="fw-bold text-secondary mb-3 pb-2 border-bottom">Thông tin cá nhân và giấy tờ pháp lý</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="fullName" class="form-label small fw-semibold">
                        Họ và tên khách hàng <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           placeholder="Ví dụ: Nguyễn Văn A" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="col-md-6">
                    <label for="mobile" class="form-label small fw-semibold">
                        Số điện thoại liên lạc <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="mobile" th:field="*{mobile}"
                           th:classappend="${#fields.hasErrors('mobile')} ? 'is-invalid' : ''"
                           placeholder="Ví dụ: 0912345678" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                </div>

                <div class="col-md-6">
                    <label for="birthday" class="form-label small fw-semibold">
                        Ngày sinh <span class="text-danger">*</span>
                    </label>
                    <input type="date" class="form-control" id="birthday" th:field="*{birthday}"
                           th:classappend="${#fields.hasErrors('birthday')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}"></div>
                </div>

                <div class="col-md-6">
                    <label for="identityCard" class="form-label small fw-semibold">
                        Số CCCD / CMND <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="identityCard" th:field="*{identityCard}"
                           th:classappend="${#fields.hasErrors('identityCard')} ? 'is-invalid' : ''"
                           placeholder="Ví dụ: 012345678901" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('identityCard')}" th:errors="*{identityCard}"></div>
                </div>

                <div class="col-md-6">
                    <label for="licenceNumber" class="form-label small fw-semibold">
                        Số Giấy phép lái xe (GPLX) <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="licenceNumber" th:field="*{licenceNumber}"
                           th:classappend="${#fields.hasErrors('licenceNumber')} ? 'is-invalid' : ''"
                           placeholder="Ví dụ: B2-123456" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('licenceNumber')}" th:errors="*{licenceNumber}"></div>
                </div>

                <div class="col-md-6">
                    <label for="licenceDate" class="form-label small fw-semibold">
                        Ngày cấp Giấy phép lái xe <span class="text-danger">*</span>
                    </label>
                    <input type="date" class="form-control" id="licenceDate" th:field="*{licenceDate}"
                           th:classappend="${#fields.hasErrors('licenceDate')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('licenceDate')}" th:errors="*{licenceDate}"></div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <a th:href="@{/admin/customers}" class="btn btn-outline-secondary px-4">
                    Hủy bỏ
                </a>
                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                    Lưu thông tin thay đổi
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>

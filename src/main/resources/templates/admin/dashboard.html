<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị hệ thống - Car Rental System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="card card-modern p-4 mb-4 border-start border-warning border-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold text-dark mb-1">🛡️ Bảng điều khiển Quản Trị Viên</h2>
                <p class="text-muted mb-0">Xin chào quản trị viên: <strong class="text-primary" th:text="${adminName}">admin</strong></p>
            </div>
            <span class="badge bg-warning text-dark px-3 py-2 fs-6">ROLE_ADMIN</span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card card-modern p-4 text-center">
                <h5 class="fw-bold">🚗 Quản lý Xe</h5>
                <p class="text-muted small">Thêm, sửa, xóa thông tin xe và tình trạng xe.</p>
                <button class="btn btn-sm btn-outline-primary btn-rounded" disabled>Tính năng sắp có</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-modern p-4 text-center">
                <h5 class="fw-bold">📋 Quản lý Đơn Thuê</h5>
                <p class="text-muted small">Duyệt và kiểm soát các đơn đặt thuê xe.</p>
                <button class="btn btn-sm btn-outline-primary btn-rounded" disabled>Tính năng sắp có</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-modern p-4 text-center">
                <h5 class="fw-bold">👥 Quản lý Người Dùng</h5>
                <p class="text-muted small">Phân quyền nhân viên và khách hàng.</p>
                <button class="btn btn-sm btn-outline-primary btn-rounded" disabled>Tính năng sắp có</button>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

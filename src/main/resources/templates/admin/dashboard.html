<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Bảng điều khiển quản trị</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card card-modern p-4 mb-4 border-start border-warning border-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold text-dark mb-1">Bảng điều khiển Quản Trị Viên</h2>
                <p class="text-muted mb-0">Xin chào quản trị viên: <strong class="text-primary" th:text="${adminName != null ? adminName : 'Admin'}">admin</strong></p>
            </div>
            <span class="badge bg-warning text-dark px-3 py-2 fs-6">Admin</span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card card-modern p-4 text-center">
                <h5 class="fw-bold">Quản lý Xe</h5>
                <p class="text-muted small">Thêm, sửa, xóa thông tin xe và tình trạng xe.</p>
                <a th:href="@{/cars}" class="btn btn-sm btn-outline-primary">Xem danh mục xe hiện tại</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-modern p-4 text-center">
                <h5 class="fw-bold">Quản lý Đơn Thuê</h5>
                <p class="text-muted small">Duyệt và kiểm soát các đơn đặt thuê xe.</p>
                <button class="btn btn-sm btn-outline-secondary" disabled>Đang triển khai Phase 3</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-modern p-4 text-center">
                <h5 class="fw-bold">Quản lý Khách Hàng</h5>
                <p class="text-muted small">Xem danh sách khách hàng và hồ sơ.</p>
                <button class="btn btn-sm btn-outline-secondary" disabled>Đang triển khai Phase 3</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">
            Car Rental <span class="text-white">System</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cars}">Danh mục xe</a>
                </li>

                <!-- Menu cho Customer -->
                <li class="nav-item" th:if="${(currentUser != null and currentUser.role == 'Customer') or (session.CURRENT_USER != null and session.CURRENT_USER.role == 'Customer')}">
                    <a class="nav-link text-info" th:href="@{/customer/rentals}">Đơn thuê của tôi</a>
                </li>
                <li class="nav-item" th:if="${(currentUser != null and currentUser.role == 'Customer') or (session.CURRENT_USER != null and session.CURRENT_USER.role == 'Customer')}">
                    <a class="nav-link text-info" th:href="@{/customer/profile}">Hồ sơ cá nhân</a>
                </li>

                <!-- Menu cho Admin -->
                <li class="nav-item" th:if="${(currentUser != null and currentUser.role == 'Admin') or (session.CURRENT_USER != null and session.CURRENT_USER.role == 'Admin')}">
                    <a class="nav-link text-warning" th:href="@{/admin/cars}">Trang quản trị</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- Khi chưa đăng nhập -->
                <div th:if="${currentUser == null and session.CURRENT_USER == null}" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3">Đăng nhập</a>
                    <a th:href="@{/register}" class="btn btn-primary btn-sm px-3">Đăng ký</a>
                </div>

                <!-- Khi đã đăng nhập -->
                <div th:if="${currentUser != null or session.CURRENT_USER != null}" class="d-flex align-items-center gap-3">
                    <span class="text-light small">
                        Xin chào, <strong class="text-white" th:text="${currentUser != null ? currentUser.accountName : session.CURRENT_USER.accountName}">User</strong>
                        <span th:if="${(currentUser != null and currentUser.role == 'Admin') or (session.CURRENT_USER != null and session.CURRENT_USER.role == 'Admin')}"
                              class="badge bg-warning text-dark ms-1">Admin</span>
                        <span th:if="${(currentUser != null and currentUser.role == 'Customer') or (session.CURRENT_USER != null and session.CURRENT_USER.role == 'Customer')}"
                              class="badge bg-info text-dark ms-1">Customer</span>
                    </span>

                    <form th:action="@{/logout}" method="post" class="d-inline m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
